[project]
name = "langgraph-agent"
version = "0.1.0"
description = "lab13 部署（langgraph dev、LangGraph Platform、API 服务化）"
readme = "README.md"
authors = [
    { name = "s8186255", email = "andrew-su@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grandalf>=0.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.2.20",
    "uvicorn>=0.30",
]

[project.scripts]
langgraph-agent = "langgraph_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
