[workspace]
resolver = "2"
members = [
    "lab1-hello-agent",
    "lab1-hello-agent-daemon",
    "lab1-hello-agent-daemon-typer",
    "lab2-tools",
    "lab3-rag",
    "lab3-rag-reference",
    "lab4-skill",
    "lab6-db",
    "lab5-websearch",
    "labfinal-a-code-review",
    "labfinal-b-kb-qa",
]

# 共享依赖版本，各 lab 引用（保证全班 API 一致）
[workspace.dependencies]
rig = "0.46.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", features = ["query"] }
regex = "1"
